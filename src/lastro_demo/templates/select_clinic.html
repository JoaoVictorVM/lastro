{% extends "base.html" %}
{% block title %}Selecionar clínica{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Selecionar clínica</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/select-clinic" id="clinic-form">
    <label for="tenant">Clínica</label>
    <select id="tenant" name="tenant" required>
      {% for clinic in clinics %}
      <option value="{{ clinic.id }}"{% if tenant and tenant.id == clinic.id %} selected{% endif %}>{{ clinic.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Continuar</button>
  </form>
</section>
{% endblock %}
