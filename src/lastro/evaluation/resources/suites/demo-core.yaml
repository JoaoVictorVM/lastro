# Suite principal: seis condições, cinco repetições, 30 explorações medidas.
schema_version: 1
id: demo-core
executor: claude-code
runs_per_condition: 5
seed: 42
conditions: [baseline, full, -heuristics, -oracles, -reproduction, -memory]
missions:
  - id: crud
    file: missions/demo-crud.md
    criteria:
      - id: persistence
        text: Os dados salvos permanecem iguais ao que foi informado depois de reabrir o registro
      - id: validation
        text: Dados inválidos são rejeitados com mensagem clara junto ao campo
      - id: isolation
        text: A lista e a busca mostram apenas funcionários da clínica selecionada
      - id: feedback
        text: A mensagem exibida depois de salvar corresponde ao que de fato foi gravado
scenarios:
  - id: crud-base
    mission: crud
    demo:
      defects: [d01, d02, d03, d04, d05, d06, d07, d08, d09, d10]
      scenarios: [s01, s02]
      variant: base
    memory:
      mode: empty
    approver:
      default: skip
      rules:
        - id: edit-phone
          tenant: aurora
          operation: update
          route: /employees/{id}/edit
          fields: [phone]
          decision: approve
          max_uses: 2
    clarifications: []
judge:
  sample_fraction: 0.2
  parse_retries: 1
limits:
  suite_budget_usd: "30.00"
