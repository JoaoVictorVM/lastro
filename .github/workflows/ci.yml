name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_SHA256_WINDOWS_X64: "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests with coverage (pytest)
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Install gitleaks
        run: |
          case "$RUNNER_OS" in
            Linux)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
              expected="$GITLEAKS_SHA256_LINUX_X64"
              ;;
            Windows)
              asset="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip"
              expected="$GITLEAKS_SHA256_WINDOWS_X64"
              ;;
          esac
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${expected}  ${asset}" | sha256sum --check --strict
          uv run --no-project python -c "import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])" \
            "$asset" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Secret scan (gitleaks)
        run: |
          gitleaks git --redact --no-banner \
            --report-format=template \
            --report-template=.github/gitleaks-report.tmpl \
            --report-path=- \
            .
