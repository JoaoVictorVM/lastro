name: Autonomous demo

# Missão autônoma contra o demo local a cada push em main. Só usa valores fictícios do demo:
# credenciais do seed, chave de provedor inventada e um modelo roteirizado. Nenhum secret real.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: autonomous-demo-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  demo:
    name: autonomous demo mission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment with the native executor
        run: uv sync --locked --extra native

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # Trigger, fila, preflight, run headless unattended no browser, comparação, relatório
      # autônomo e outbox, com o demo servido localmente pelo próprio teste.
      - name: Run the autonomous demo mission
        env:
          LASTRO_AUTONOMOUS_ARTIFACT_DIR: ${{ runner.temp }}/lastro-autonomous
        run: uv run pytest -q -p no:cacheprovider tests/integration/test_autonomous_demo.py

      - name: Upload the autonomous report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lastro-autonomous-report
          path: ${{ runner.temp }}/lastro-autonomous
          if-no-files-found: error
          retention-days: 14
