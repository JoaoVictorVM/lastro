# Revisions are pinned to reviewed commit SHAs; the tag each SHA points to is kept in the comment.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # frozen: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        args:
          - --no-banner
          - --log-level=warn
          - --report-format=template
          - --report-template=.github/gitleaks-report.tmpl
          - --report-path=-

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      # Vendored third-party files stay byte-identical to the upstream release.
      - id: end-of-file-fixer
        exclude: ^src/lastro_demo/static/htmx\.min\.js$
      - id: trailing-whitespace
        exclude: ^src/lastro_demo/static/htmx\.min\.js$
      - id: check-added-large-files
        args: [--maxkb=1024]
