[project]
name = "lastro"
version = "0.1.0"
description = "Agente de exploração de sistemas web com políticas, histórico auditável e evidências."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "typer>=0.27.3",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
lastro = "lastro.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastro", "src/lastro_demo"]

[tool.hatch.build.targets.sdist]
include = ["src/lastro", "src/lastro_demo", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Separador de caminho nas mensagens de erro de configuração.
allowed-confusables = ["›"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/lastro"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]

[tool.coverage.run]
source_pkgs = ["lastro", "lastro_demo"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]
