# Gitleaks configuration: default rules plus reviewed allowlist entries only.
# Policy (see SECURITY.md): an entry is allowed only for a reviewed false positive, never to make
# CI pass, and must explain here why the match is not a secret.

[extend]
useDefault = true

[[allowlists]]
description = "Fictitious demo login passwords"
# These are the deliberately fake defaults of the bundled demo, published in
# src/lastro_demo/.env.example and asserted by the demo tests. They protect nothing real.
regexTarget = "secret"
regexes = ['''^senha-falsa-(aurora|boreal|multi)-123$''']

[[allowlists]]
description = "Fictitious project_id of the authentication integration tests"
# A project_id is a public UUID that only names the project folder in the private data root;
# it grants no access. This fixed value lives in tests/integration/conftest.py.
regexTarget = "secret"
regexes = ['''^5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e$''']

[[allowlists]]
description = "Sentinel password of the credential resolution unit tests"
# Made-up value used only to assert that a credential never shows up in errors, reprs or
# pickles (tests/unit/test_auth_credentials.py). It protects nothing real.
regexTarget = "secret"
regexes = ['''^senha-sentinela-credencial-42$''']
